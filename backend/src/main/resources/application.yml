server:
  port: 8080

spring:
  application:
    name: smart-campus-optimizer
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_campus_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Custom Application & Security Settings
app:
  jwt:
    secret: 9a6747f6f12c45f002d664f36f3f6071e50192d61e342c56b2e0e953e0ee90a1
    expiration-ms: 86400000 # 24 hours
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
